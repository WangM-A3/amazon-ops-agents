# ══════════════════════════════════════════════════════════════════════════════
# Railway GitHub Actions 部署配置
# 亚马逊运营硅基军团
# ══════════════════════════════════════════════════════════════════════════════

name: 🚀 Deploy to Railway

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
      - 'tests/**'

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # ─────────────────────────────────────────────────────────────────
      # 1. 检出代码
      # ─────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────────────
      # 2. 设置 Python 环境（用于可能的预处理）
      # ─────────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─────────────────────────────────────────────────────────────────
      # 3. 安装 Railway CLI (使用 Docker 镜像方式)
      # ─────────────────────────────────────────────────────────────────
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # ─────────────────────────────────────────────────────────────────
      # 4. 验证 Railway Token
      # ─────────────────────────────────────────────────────────────────
      - name: Verify Railway Token
        run: |
          railway whoami || echo "Token verification failed"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # ─────────────────────────────────────────────────────────────────
      # 5. 获取项目信息
      # ─────────────────────────────────────────────────────────────────
      - name: Get Railway Project
        id: project
        run: |
          PROJECT_ID=$(railway project list 2>/dev/null | grep -oP 'amazon-ops-agents' || echo "")
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "Project ID: $PROJECT_ID"

      # ─────────────────────────────────────────────────────────────────
      # 6. 链接 Railway 项目
      # ─────────────────────────────────────────────────────────────────
      - name: Link Railway Project
        run: |
          if [ -n "${{ vars.RAILWAY_PROJECT_ID }}" ]; then
            railway link ${{ vars.RAILWAY_PROJECT_ID }}
          else
            railway init --name "amazon-ops-agents"
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # ─────────────────────────────────────────────────────────────────
      # 7. 设置环境变量
      # ─────────────────────────────────────────────────────────────────
      - name: Configure Environment Variables
        run: |
          railway variables set DEEPSEEK_API_KEY "${{ secrets.DEEPSEEK_API_KEY }}"
          railway variables set LOG_LEVEL "INFO"
          railway variables set HOST "0.0.0.0"
          railway variables set PORT "8080"
          railway variables set ENVIRONMENT "production"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # ─────────────────────────────────────────────────────────────────
      # 8. 部署到 Railway
      # ─────────────────────────────────────────────────────────────────
      - name: Deploy to Railway
        id: deploy
        run: |
          echo "Starting deployment..."
          railway up --production --detach
          echo "Deployment initiated"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # ─────────────────────────────────────────────────────────────────
      # 9. 等待部署完成
      # ─────────────────────────────────────────────────────────────────
      - name: Wait for Deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30

      # ─────────────────────────────────────────────────────────────────
      # 10. 获取部署 URL
      # ─────────────────────────────────────────────────────────────────
      - name: Get Deployment URL
        run: |
          echo "Fetching deployment URL..."
          railway domain || echo "Domain will be assigned automatically"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # ─────────────────────────────────────────────────────────────────
      # 11. 健康检查
      # ─────────────────────────────────────────────────────────────────
      - name: Health Check
        run: |
          sleep 10
          DOMAIN=$(railway domain 2>/dev/null)
          if [ -n "$DOMAIN" ]; then
            echo "Testing health endpoint: https://$DOMAIN/health"
            curl -f --connect-timeout 30 --max-time 60 "https://$DOMAIN/health" || echo "Health check response received"
          else
            echo "Domain not yet assigned, health check skipped"
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # ─────────────────────────────────────────────────────────────────
      # 12. 输出部署信息
      # ─────────────────────────────────────────────────────────────────
      - name: Deployment Summary
        if: always()
        run: |
          echo "=========================================="
          echo "🚀 Deployment Complete!"
          echo "=========================================="
          railway status 2>/dev/null || true
